version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: slo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-slo_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-slo_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exam_reliability_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-slo_admin} -d ${POSTGRES_DB:-slo_dashboard}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: slo_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-slo_admin}:${POSTGRES_PASSWORD:-exam_reliability_2026}@postgres:5432/${POSTGRES_DB:-slo_dashboard}
      PORT: 8000
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: slo_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
